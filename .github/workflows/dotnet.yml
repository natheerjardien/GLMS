# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Core CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: List files (Troubleshooting)
      run: ls -R

    - name: Restore dependencies
      run: dotnet restore PROG7311_GLMS_ST10435542/PROG7311_GLMS_ST10435542.slnx

    - name: Build
      run: dotnet build PROG7311_GLMS_ST10435542/PROG7311_GLMS_ST10435542.slnx -c Release --no-restore

    - name: Test
      run: dotnet test PROG7311_GLMS_ST10435542/PROG7311_GLMS_ST10435542.slnx -c Release --no-build --verbosity normal